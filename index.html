<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Weather & Music Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* 배경 전환 애니메이션 및 기본 설정 */
        body { 
            font-family: 'Pretendard', sans-serif; 
            display: flex; 
            justify-content: center; 
            padding: 20px; 
            margin: 0; 
            transition: background 1s ease; /* 배경색 변경 시 부드럽게 전환 */
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* 맑은 날 배경 */
        body.sunny { background: linear-gradient(135deg, #74ebd5 0%, #ACB6E5 100%); }
        /* 흐린 날 배경 */
        body.cloudy { background: linear-gradient(135deg, #bdc3c7 0%, #2c3e50 100%); }
        /* 비 오는 날 배경 (애니메이션 효과 포함) */
        body.rainy { background: #202020; overflow: hidden; }

        /* 비 애니메이션 효과 */
        .rain { position: fixed; top: -10%; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; display: none; }
        body.rainy .rain { display: block; }
        .drop { position: absolute; background: rgba(255, 255, 255, 0.3); width: 2px; height: 15px; top: -100px; animation: fall 0.5s linear infinite; }
        @keyframes fall { to { transform: translateY(110vh); } }

        .card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(5px); padding: 25px; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); width: 100%; max-width: 650px; text-align: center; z-index: 10; margin: auto; }
        .welcome-msg { font-size: 0.9rem; color: #555; margin-bottom: 10px; font-weight: 500; }
        .city-section { margin-bottom: 20px; border-bottom: 1px solid #ddd; padding-bottom: 15px; }
        .section-title { font-size: 0.85rem; color: #444; font-weight: bold; margin-bottom: 10px; text-align: left; padding-left: 5px; border-left: 3px solid #007bff; margin-left: 5px; }
        .city-buttons { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-bottom: 15px; }
        .city-btn { padding: 6px 12px; border: 1px solid #ccc; border-radius: 10px; background: white; cursor: pointer; font-size: 0.8rem; transition: 0.2s; color: #333; }
        .city-btn:hover { background: #007bff; color: white; border-color: #007bff; }
        .temp-display { margin: 15px 0; }
        .temp { font-size: 3.5rem; font-weight: 800; color: #007bff; margin: 5px 0; }
        #desc-val { font-size: 1.2rem; color: #333; margin-bottom: 10px; font-weight: 600; }
        .chart-container { height: 200px; margin: 20px 0; padding: 10px; background: rgba(255, 255, 255, 0.8); border-radius: 15px; }
        .music-box { background: rgba(248, 251, 255, 0.9); padding: 18px; border-radius: 15px; border: 1px solid #dbeafe; text-align: left; }
        .music-title { color: #007bff; font-weight: bold; font-size: 0.85rem; display: block; margin-bottom: 10px; }
        #music-list { font-size: 0.9rem; line-height: 1.7; color: #333; margin: 0; padding-left: 20px; list-style-type: disc; }
    </style>
</head>
<body class="sunny"> <!-- 기본 배경: 맑음 -->

<div class="rain" id="rain-effect"></div> <!-- 비 효과 컨테이너 -->

<div class="card">
    <div id="welcome-area" class="welcome-msg">반가워요! 날씨에 맞춰 배경이 변합니다.</div>

    <div class="city-section">
        <div class="section-title">대한민국 주요 도시</div>
        <div class="city-buttons">
            <button class="city-btn" onclick="updateDashboard(37.5665, 126.9780, '서울')">서울</button>
            <button class="city-btn" onclick="updateDashboard(37.4563, 126.7052, '인천')">인천</button>
            <button class="city-btn" onclick="updateDashboard(37.3943, 126.9568, '안양')">안양</button>
            <button class="city-btn" onclick="updateDashboard(37.3212, 126.8308, '안산')">안산</button>
            <button class="city-btn" onclick="updateDashboard(36.3504, 127.3845, '대전')">대전</button>
            <button class="city-btn" onclick="updateDashboard(35.8714, 128.6014, '대구')">대구</button>
            <button class="city-btn" onclick="updateDashboard(35.1796, 129.0756, '부산')">부산</button>
            <button class="city-btn" onclick="updateDashboard(35.1595, 126.8526, '광주')">광주</button>
            <button class="city-btn" onclick="updateDashboard(35.5384, 129.3114, '울산')">울산</button>
            <button class="city-btn" onclick="updateDashboard(33.4996, 126.5312, '제주')">제주</button>
        </div>
    </div>

    <div class="city-section">
        <div class="section-title">주변국 수도</div>
        <div class="city-buttons">
            <button class="city-btn" onclick="updateDashboard(35.6895, 139.6917, '도쿄 (일본)')">도쿄</button>
            <button class="city-btn" onclick="updateDashboard(39.9042, 116.4074, '베이징 (중국)')">베이징</button>
            <button class="city-btn" onclick="updateDashboard(25.0330, 121.5654, '타이베이 (대만)')">타이베이</button>
            <button class="city-btn" onclick="updateDashboard(21.0285, 105.8542, '하노이 (베트남)')">하노이</button>
            <button class="city-btn" onclick="updateDashboard(14.5995, 120.9842, '마닐라 (필리핀)')">마닐라</button>
            <button class="city-btn" onclick="updateDashboard(47.9188, 106.9175, '울란바토르 (몽골)')">울란바토르</button>
        </div>
    </div>

    <div class="temp-display">
        <h2 id="city-name" style="margin:0; color:#333;">날씨 데이터 조회 중...</h2>
        <div class="temp"><span id="temp-val">--</span>°C</div>
        <div id="desc-val">-</div>
    </div>

    <div class="chart-container"><canvas id="weatherChart"></canvas></div>

    <div class="music-box">
        <span class="music-title">🎧 날씨 감성 맞춤곡 (3곡 무작위)</span>
        <ul id="music-list">선곡 중입니다...</ul>
    </div>
</div>

<script>
    const W_KEY = '1548c4c0650dbd309f6593be238a26ea'; 
    const L_KEY = '1518e370a2ef192ac4c5849062ba83b3';
    let myChart;

    const weatherFix = { "실 비": "가랑비", "실비": "가랑비", "온흐림": "흐림", "튼구름": "구름 조금", "박무": "옅은 안개" };
    const tagMap = { "가랑비": "k-ballad", "비": "korean-ballad", "맑음": "k-pop", "흐림": "k-indie", "구름 조금": "k-hiphop", "눈": "korean-ost" };

    // 배경 변경 함수
    function changeBackground(desc) {
        const body = document.body;
        const rainContainer = document.getElementById('rain-effect');
        body.className = ''; 
        rainContainer.innerHTML = ''; 

        if (desc.includes("비") || desc.includes("가랑비")) {
            body.classList.add('rainy');
            // 물방울 생성 로직
            for (let i = 0; i < 50; i++) {
                const drop = document.createElement('div');
                drop.className = 'drop';
                drop.style.left = Math.random() * 100 + 'vw';
                drop.style.animationDuration = (0.2 + Math.random() * 0.3) + 's';
                drop.style.animationDelay = Math.random() * 2 + 's';
                rainContainer.appendChild(drop);
            }
        } else if (desc.includes("맑음")) {
            body.classList.add('sunny');
        } else {
            body.classList.add('cloudy');
        }
    }

    function updateWelcomeMsg() {
        const hour = new Date().getHours();
        let msg = (hour < 6) ? "포근한 새벽이네요. ✨" : (hour < 12) ? "기분 좋은 아침입니다. ☀️" : (hour < 18) ? "활기찬 오후입니다. ☕" : "편안한 밤 되세요. 🌙";
        document.getElementById('welcome-area').innerText = msg;
    }

    async function updateDashboard(lat, lon, name) {
        updateWelcomeMsg();
        try {
            const res = await fetch(`https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&appid=${W_KEY}&units=metric&lang=kr`);
            const data = await res.json();
            let desc = weatherFix[data.weather[0].description] || data.weather[0].description;

            document.getElementById('city-name').innerText = name;
            document.getElementById('temp-val').innerText = Math.round(data.main.temp);
            document.getElementById('desc-val').innerText = desc;

            changeBackground(desc); // 날씨에 따른 배경 전환 실행
            drawChart(data.main.temp);
            getMusicFromLastFM(desc);
        } catch (e) { console.error(e); }
    }

    async function getMusicFromLastFM(desc) {
        const musicList = document.getElementById('music-list');
        const tag = tagMap[desc] || "kpop";
        try {
            const res = await fetch(`https://ws.audioscrobbler.com/2.0/?method=tag.gettoptracks&tag=${tag}&api_key=${L_KEY}&format=json&limit=50`);
            const data = await res.json();
            let tracks = data.tracks.track;
            for (let i = tracks.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [tracks[i], tracks[j]] = [tracks[j], tracks[i]];
            }
            musicList.innerHTML = tracks.slice(0, 3).map(t => `<li><strong>${t.artist.name}</strong> - ${t.name}</li>`).join('');
        } catch (e) { musicList.innerHTML = "<li>음악 로드 실패</li>"; }
    }

    function drawChart(temp) {
        const ctx = document.getElementById('weatherChart').getContext('2d');
        const labels = []; const values = []; const today = new Date();
        for (let i = 9; i >= 0; i--) {
            const d = new Date(today); d.setDate(today.getDate() - i);
            labels.push(`${d.getMonth() + 1}/${d.getDate()}`);
            values.push((temp + (Math.random() * 4 - 2)).toFixed(1));
        }
        if (myChart) myChart.destroy();
        myChart = new Chart(ctx, {
            type: 'line',
            data: { labels, datasets: [{ label: '기온', data: values, borderColor: '#007bff', backgroundColor: 'rgba(0,123,255,0.1)', fill: true, tension: 0.4 }] },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
        });
    }

    updateDashboard(37.5665, 126.9780, '서울');
</script>
</body>
</html>
