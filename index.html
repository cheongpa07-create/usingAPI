<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>날씨 & 음악 추천</title>
<style>
/* 디자인은 이전과 동일하게 유지하거나 조금 더 깔끔하게 다듬었습니다 */
body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background: #e0f2fe; }
.container { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 320px; text-align: center; }
.temp { font-size: 2.5rem; font-weight: bold; color: #0284c7; }
.music-box { background: #f8fafc; padding: 15px; border-radius: 10px; margin-top: 20px; border-left: 4px solid #0284c7; font-size: 0.9rem; }
button { margin-top: 15px; padding: 8px 15px; cursor: pointer; border: none; border-radius: 5px; background: #0284c7; color: white; }
</style>
</head>
<body>

<div class="container">
<h3 id="city">날씨를 확인하는 중...</h3>
<div class="temp"><span id="current-temp">--</span>°C</div>
<p id="description">-</p>

<div class="music-box">
<strong>🎵 오늘의 추천 음악</strong>
<p id="music-recommendation">날씨 정보를 가져오면 추천을 시작합니다.</p>
</div>
<button onclick="location.reload()">새로고침</button>
</div>

<script>
// ⚠️ 본인의 키로 꼭 바꿔주세요!
const WEATHER_API_KEY = '1548c4c0650dbd309f6593be238a26ea';
const GEMINI_API_KEY = 'AIzaSyDU3FXhiQCa-Hvp_ZYdj8vV6fFADqV4zXI';

async function init() {
const loadingTimeout = setTimeout(() => {
console.log("위치 응답이 너무 느려 기본값(서울)으로 실행합니다.");
getWeatherByCoords(37.5665, 126.9780); // 서울 위도, 경도
}, 3000); // 3초 동안 응답 없으면 강제 실행

if (navigator.geolocation) {
navigator.geolocation.getCurrentPosition(
(pos) => {
clearTimeout(loadingTimeout);
getWeatherByCoords(pos.coords.latitude, pos.coords.longitude);
},
() => {
clearTimeout(loadingTimeout);
console.log("위치 권한 거부됨. 기본값 사용.");
getWeatherByCoords(37.5665, 126.9780);
}
);
}
}

async function getWeatherByCoords(lat, lon) {
try {
const res = await fetch(https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&appid=${WEATHER_API_KEY}&units=metric&lang=kr`);
const data = await res.json();

if (data.cod !== 200) throw new Error(data.message);

document.getElementById('city').innerText = data.name;
document.getElementById('current-temp').innerText = Math.round(data.main.temp);
document.getElementById('description').innerText = data.weather[0].description;

getGeminiMusic(data.main.temp, data.weather[0].description);
} catch (err) {
document.getElementById('city').innerText = "오류 발생";
document.getElementById('music-recommendation').innerText = "API 키를 확인하거나 잠시 후 시도해주세요: " + err.message;
}
}

async function getGeminiMusic(temp, desc) {
const prompt = ``${desc}, 기온은 latex
{temp}도인 날씨에 어울리는 음악 장르 하나를 이유와 함께 아주 짧게 한 문장으로 추천해줘.`; try { const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=

{GEMINI_API_KEY}`, {
method: 'POST',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
});
const data = await res.json();
const text = data.candidates[0].content.parts[0].text;
document.getElementById('music-recommendation').innerText = text;
} catch (err) {
document.getElementById('music-recommendation').innerText = "음악 추천을 가져오지 못했습니다.";
}
}

init();
</script>
</body>
</html>
