<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K-Weather AI Music Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* 기존 디자인 스타일 유지 */
        body { font-family: 'Pretendard', sans-serif; background: #f0f4f8; display: flex; justify-content: center; padding: 20px; margin: 0; }
        .card { background: white; padding: 25px; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 100%; max-width: 580px; text-align: center; }
        .city-buttons { display: flex; flex-wrap: wrap; justify-content: center; gap: 5px; margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 15px; }
        .city-btn { padding: 6px 12px; border: 1px solid #e1e1e1; border-radius: 12px; background: white; cursor: pointer; font-size: 0.75rem; transition: 0.2s; }
        .city-btn:hover { background: #007bff; color: white; border-color: #007bff; }
        .temp-display { margin: 15px 0; }
        .temp { font-size: 3.5rem; font-weight: 800; color: #007bff; margin: 5px 0; }
        .chart-container { height: 220px; margin: 20px 0; }
        .music-box { background: #f8fbff; padding: 18px; border-radius: 15px; border: 1px solid #dbeafe; text-align: left; }
        .section-title { font-size: 0.8rem; color: #007bff; font-weight: bold; width: 100%; margin: 10px 0 5px; text-align: left; padding-left: 10px; }
    </style>
</head>
<body>

<div class="card">
    <!-- 도시 버튼 섹션 -->
    <div class="city-buttons">
        <div class="section-title">대한민국 주요 도시</div>
        <button class="city-btn" onclick="updateDashboard(37.5665, 126.9780, '서울특별시')">서울</button>
        <button class="city-btn" onclick="updateDashboard(35.1796, 129.0756, '부산광역시')">부산</button>
        <button class="city-btn" onclick="updateDashboard(35.8714, 128.6014, '대구광역시')">대구</button>
        <button class="city-btn" onclick="updateDashboard(13.7563, 100.5018, '방콕 🇹🇭')">방콕</button>
    </div>

    <div class="temp-display">
        <h2 id="city-name">날씨 확인 중...</h2>
        <div class="temp"><span id="temp-val">--</span>°C</div>
        <div id="desc-val">데이터 로딩 중</div>
    </div>

    <div class="chart-container"><canvas id="weatherChart"></canvas></div>

    <div class="music-box">
        <small style="color:#007bff; font-weight:bold;">🎵 Mistral AI 날씨 음악 추천</small>
        <p id="music-text">잠시만 기다려주세요...</p>
    </div>
</div>

<script>
    // ⚠️ 보안을 위해 키를 코드에 직접 적지 않고, 접속 시 입력받습니다.
    const HF_TOKEN = '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';
    const W_KEY = '1548c4c0650dbd309f6593be238a26ea'; // 본인의 날씨 키

    let myChart;

    async function init() {
        updateDashboard(13.7563, 100.5018, '방콕'); // 초기 도시 설정
    }

    async function updateDashboard(lat, lon, name) {
        try {
            const res = await fetch(`https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&appid=${W_KEY}&units=metric&lang=kr`);
            const data = await res.json();
            const desc = data.weather[0].description;

            document.getElementById('city-name').innerText = name;
            document.getElementById('temp-val').innerText = Math.round(data.main.temp);
            document.getElementById('desc-val').innerText = desc;

            drawChart(data.main.temp);
            getMusic(data.main.temp, desc);
        } catch (e) { console.error(e); }
    }

    function drawChart(currentTemp) {
        const ctx = document.getElementById('weatherChart').getContext('2d');
        const labels = ['5/8', '5/9', '5/10', '5/11', '5/12'];
        const dataValues = [33.5, 35.2, 33.0, 35.8, currentTemp];

        if (myChart) myChart.destroy();
        myChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    data: dataValues,
                    borderColor: '#007bff',
                    backgroundColor: 'rgba(0,123,255,0.1)',
                    fill: true,
                    tension: 0.4
                }]
            },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
        });
    }

    async function getMusic(temp, desc) {
        const mBox = document.getElementById('music-text');
        
        // 1. API 키가 없을 때를 대비한 기본 리스트 (Fallback)
        const fallback = "현재 날씨에는 'NewJeans - Hype Boy'를 추천합니다! (상쾌한 기분을 느껴보세요)";

        if (!HF_TOKEN) {
            mBox.innerText = fallback;
            return;
        }

        mBox.innerText = "AI가 분석 중입니다...";

        try {
            const response = await fetch(
                "https://api-inference.huggingface.co/models/mistralai/Mistral-7B-Instruct-v0.3",
                {
                    headers: { "Authorization": `Bearer ${HF_TOKEN}`, "Content-Type": "application/json" },
                    method: "POST",
                    body: JSON.stringify({
                        inputs: `[INST] Weather: ${desc}, Temp: ${temp}C. Recommend 1 K-pop song with reason in Korean. [/INST]`,
                        parameters: { max_new_tokens: 100 }
                    }),
                }
            );

            const result = await response.json();
            
            // 모델 로딩 중 대응 (503 에러 등)
            if (result.error) {
                mBox.innerText = "AI 모델이 깨어나는 중입니다. 잠시 후 다시 도시를 클릭해주세요!";
                return;
            }

            if (result[0] && result[0].generated_text) {
                const text = result[0].generated_text.split('[/INST]')[1] || result[0].generated_text;
                mBox.innerText = text.trim();
            } else {
                mBox.innerText = fallback;
            }
        } catch (e) {
            mBox.innerText = fallback;
        }
    }

    init();
</script>
</body>
</html>
