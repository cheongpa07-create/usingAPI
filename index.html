<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오늘의 날씨와 음악</title>
<style>
body {
font-family: 'Pretendard', sans-serif;
display: flex;
justify-content: center;
align-items: center;
min-height: 100vh;
margin: 0;
background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);
color: #333;
}
.container {
background: rgba(255, 255, 255, 0.9);
padding: 2rem;
border-radius: 20px;
box-shadow: 0 10px 30px rgba(0,0,0,0.1);
width: 90%;
max-width: 400px;
text-align: center;
}
.weather-box { margin-bottom: 20px; }
.temp { font-size: 3rem; font-weight: bold; margin: 10px 0; }
.music-box {
background: #f0f4f8;
padding: 15px;
border-radius: 15px;
border-left: 5px solid #007bff;
}
#loading { color: #666; font-style: italic; }
button {
margin-top: 20px;
padding: 10px 20px;
border: none;
border-radius: 10px;
background: #007bff;
color: white;
cursor: pointer;
}
</style>
</head>
<body>

<div class="container">
<h2>🌤️ 오늘의 날씨 & 음악</h2>

<div id="loading">위치 정보를 가져오는 중...</div>

<div id="content" style="display:none;">
<div class="weather-box">
<h3 id="city">서울</h3>
<div class="temp"><span id="current-temp">0</span>°C</div>
<p id="description">맑음</p>
</div>

<div class="music-box">
<h4>🎵 Gemini의 추천</h4>
<p id="music-recommendation">날씨에 맞는 음악을 생각 중이에요...</p>
</div>

<button onclick="location.reload()">새로고침</button>
</div>
</div>

<script>
// ⚠️ 여기에 본인의 API 키를 입력하세요!
const WEATHER_API_KEY = '1548c4c0650dbd309f6593be238a26ea';
const GEMINI_API_KEY = 'AIzaSyDU3FXhiQCa-Hvp_ZYdj8vV6fFADqV4zXI';

async function init() {
if (navigator.geolocation) {
navigator.geolocation.getCurrentPosition(getWeather, () => {
alert("위치 권한을 허용해주세요!");
});
}
}

async function getWeather(position) {
const lat = position.coords.latitude;
const lon = position.coords.longitude;

try {
// 1. OpenWeatherMap API 호출
const response = await fetch(https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&appid=${WEATHER_API_KEY}&units=metric&lang=kr`);
const data = await response.json();

document.getElementById('city').innerText = data.name;
document.getElementById('current-temp').innerText = Math.round(data.main.temp);
document.getElementById('description').innerText = data.weather[0].description;

// 날씨 로딩 완료 후 콘텐츠 표시
document.getElementById('loading').style.display = 'none';
document.getElementById('content').style.display = 'block';

// 2. Gemini API 호출 (음악 추천)
getMusicRecommendation(data.main.temp, data.weather[0].description);

} catch (error) {
console.error("날씨 정보 호출 실패:", error);
}
}

async function getMusicRecommendation(temp, desc) {
const prompt = 현재 날씨는${desc}이고 기온은 ${temp}도야. 이런 날씨에 듣기 좋은 음악 장르나 분위기를 짧게 한 문장으로 추천해줘.;

try {
const response = await fetch(https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
method: 'POST',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify({
contents: [{ parts: [{ text: prompt }] }]
})
});
const data = await response.json();
const text = data.candidates[0].content.parts[0].text;
document.getElementById('music-recommendation').innerText = text;
} catch (error) {
document.getElementById('music-recommendation').innerText = "음악 추천을 불러오지 못했습니다.";
}
}

init();
</script>
</body>
</html>
