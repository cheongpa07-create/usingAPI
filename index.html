<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K-Weather & Global Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Pretendard', sans-serif; background: #f0f4f8; display: flex; justify-content: center; padding: 20px; margin: 0; }
        .card { background: white; padding: 25px; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 100%; max-width: 550px; text-align: center; }
        .city-buttons { display: flex; flex-wrap: wrap; justify-content: center; gap: 5px; margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 15px; }
        .city-btn { padding: 5px 10px; border: 1px solid #e1e1e1; border-radius: 15px; background: white; cursor: pointer; font-size: 0.7rem; transition: 0.2s; }
        .city-btn:hover { background: #007bff; color: white; border-color: #007bff; }
        .temp-display { margin: 15px 0; }
        .temp { font-size: 3.5rem; font-weight: 800; color: #007bff; }
        #desc-val { font-size: 1.2rem; color: #555; margin-bottom: 10px; }
        .chart-container { height: 160px; margin: 15px 0; }
        .music-box { background: #f8fbff; padding: 15px; border-radius: 15px; border: 1px solid #dbeafe; text-align: left; }
        #music-text { font-size: 0.9rem; line-height: 1.5; color: #333; margin: 0; }
        .section-title { font-size: 0.75rem; color: #999; width: 100%; margin: 10px 0 5px; text-align: left; padding-left: 10px; }
    </style>
</head>
<body>

<div class="card">
    <div class="city-buttons">
        <div class="section-title">대한민국 주요 도시</div>
        <button class="city-btn" onclick="updateDashboard(37.5665, 126.9780, '서울')">서울</button>
        <button class="city-btn" onclick="updateDashboard(37.4563, 126.7052, '인천')">인천</button>
        <button class="city-btn" onclick="updateDashboard(36.3504, 127.3845, '대전')">대전</button>
        <button class="city-btn" onclick="updateDashboard(35.1796, 129.0756, '부산')">부산</button>
        <button class="city-btn" onclick="updateDashboard(35.1595, 126.8526, '광주')">광주</button>
        <button class="city-btn" onclick="updateDashboard(35.8714, 128.6014, '대구')">대구</button>
        <button class="city-btn" onclick="updateDashboard(35.5384, 129.3114, '울산')">울산</button>
        <button class="city-btn" onclick="updateDashboard(33.4996, 126.5312, '제주')">제주</button>
        <button class="city-btn" onclick="updateDashboard(37.8854, 127.7298, '춘천')">춘천</button>
        <button class="city-btn" onclick="updateDashboard(36.4846, 127.2892, '세종')">세종</button>
        <button class="city-btn" onclick="updateDashboard(36.6424, 127.4892, '청주')">청주</button>
        <button class="city-btn" onclick="updateDashboard(36.8151, 127.1139, '천안')">천안</button>
        <button class="city-btn" onclick="updateDashboard(36.0190, 129.3435, '포항')">포항</button>
        <button class="city-btn" onclick="updateDashboard(35.2285, 128.6811, '창원')">창원</button>
        <button class="city-btn" onclick="updateDashboard(34.8118, 126.3922, '목포')">목포</button>
        <button class="city-btn" onclick="updateDashboard(36.5760, 128.5056, '안동')">안동</button>
        <button class="city-btn" onclick="updateDashboard(35.8242, 127.1480, '전주')">전주</button>

        <div class="section-title">주변국 수도</div>
        <button class="city-btn" onclick="updateDashboard(35.6895, 139.6917, '도쿄')">도쿄 🇯🇵</button>
        <button class="city-btn" onclick="updateDashboard(39.9042, 116.4074, '베이징')">베이징 🇨🇳</button>
        <button class="city-btn" onclick="updateDashboard(21.0285, 105.8542, '하노이')">하노이 🇻🇳</button>
        <button class="city-btn" onclick="updateDashboard(13.7563, 100.5018, '방콕')">방콕 🇹🇭</button>
        <button class="city-btn" onclick="updateDashboard(14.5995, 120.9842, '마닐라')">마닐라 🇵🇭</button>
    </div>

    <div class="temp-display">
        <h2 id="city-name" style="margin:0; color:#333;">날씨 확인 중...</h2>
        <div class="temp"><span id="temp-val">--</span>°C</div>
        <div id="desc-val">-</div>
    </div>

    <div class="chart-container"><canvas id="weatherChart"></canvas></div>

    <div class="music-box">
        <small style="color:#007bff; font-weight:bold;">🎵 내 위치 맞춤 AI 음악 추천</small>
        <p id="music-text">위치 정보를 확인하고 있습니다...</p>
    </div>
</div>

<script>
    const W_KEY = '1548c4c0650dbd309f6593be238a26ea'; 
    const G_KEY = 'AIzaSyDU3FXhiQCa-Hvp_ZYdj8vV6fFADqV4zXI';
    let myChart;

    const weatherFix = { "온흐림": "흐림", "튼구름": "구름 조금", "조금 흐림": "구름 많음", "실비": "가벼운 비" };

    async function init() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(async (pos) => {
                updateDashboard(pos.coords.latitude, pos.coords.longitude, "내 위치", true);
            }, () => updateDashboard(37.5665, 126.9780, "서울", true));
        }
    }

    async function updateDashboard(lat, lon, name, isInitial = false) {
        try {
            const res = await fetch(`https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&appid=${W_KEY}&units=metric&lang=kr`);
            const data = await res.json();
            
            let desc = data.weather[0].description;
            desc = weatherFix[desc] || desc;

            document.getElementById('city-name').innerText = name;
            document.getElementById('temp-val').innerText = Math.round(data.main.temp);
            document.getElementById('desc-val').innerText = desc;

            drawChart(data.main.temp);
            
            // 음악 추천은 '내 위치' 기준 혹은 도시 변경 시마다 새로고침
            getMusic(data.main.temp, desc);
        } catch (e) { console.error("날씨 불러오기 실패:", e); }
    }

    async function getMusic(temp, desc) {
        const musicDisplay = document.getElementById('music-text');
        musicDisplay.innerText = "Gemini가 음악을 고르고 있어요...";

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${G_KEY}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: `날씨는 ${desc}이고 온도는 ${temp}도야. 이 상황에 어울리는 음악 장르와 노래 1곡을 짧게 한 문장으로 추천해줘.` }] }]
                })
            });

            const data = await response.json();
            
            if (data.candidates && data.candidates[0].content.parts[0].text) {
                musicDisplay.innerText = data.candidates[0].content.parts[0].text;
            } else {
                throw new Error("Invalid response");
            }
        } catch (e) {
            console.error("Gemini Error:", e);
            musicDisplay.innerText = "음악 추천을 위해 API 키를 다시 확인해주세요.";
        }
    }

    function drawChart(currentTemp) {
        const ctx = document.getElementById('weatherChart').getContext('2d');
        const dataValues = Array.from({length: 12}, () => currentTemp + (Math.random() * 6 - 3));
        if (myChart) myChart.destroy();
        myChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: Array(12).fill(''),
                datasets: [{ data: dataValues, borderColor: '#007bff', backgroundColor: 'rgba(0,123,255,0.05)', fill: true, tension: 0.4, pointRadius: 3 }]
            },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { display: false }, y: { grid: { color: '#f0f0f0' } } } }
        });
    }

    init();
</script>
</body>
</html>
